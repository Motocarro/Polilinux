# Polilinux neofetch configuration

print_info() {
    info title
    info underline

    info "OS" distro
    # If the line above still shows another distro name, use this instead:
    # prin "OS" "Polilinux"
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "DE" de
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Disk" disk

    info cols
}

# Logo: Polinetwork symbol, colours 25 (blue) and 231 (white)
image_backend="ascii"
image_source="/usr/share/polilinux/logo.txt"
ascii_colors=(25 231)
ascii_bold="off"

# Text colours: title, @, underline, subtitle, colon, info
colors=(33 7 7 33 7 7)
bold="on"
