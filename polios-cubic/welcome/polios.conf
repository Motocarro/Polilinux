# PoliOS Welcome settings (installed root-owned in /opt/polios-welcome by install.sh).
[remote]
# Online course list. Leave empty to use only the list built into the system (courses.conf).
# Must be an https://raw.githubusercontent.com/... URL (anything else is ignored), for example:
#   courses_url = https://raw.githubusercontent.com/ORG/REPO/BRANCH/courses.conf
# Whoever can edit that file decides what gets installed on students' computers:
# protect that branch (pull request + review required).
courses_url = https://raw.githubusercontent.com/PoliNetworkOrg/PoliOS/main/polios-cubic/welcome/courses.conf
