# PoliOS Welcome: course list.

# One [section] per course group:

#
#   [short-id]                 lowercase letters, digits and "-"
#   title       = ...          shown in the wizard (ITALIAN, the default language)
#   title_en    = ...          optional English title (falls back to the Italian one)
#   description = ...          optional, shown after the title (Italian)
#   description_en = ...       optional English description
#   apt         = a b c        apt packages (space separated; can continue on indented lines)
#   flatpak     = x.y.Z        optional Flathub app IDs (reverse-DNS, e.g. org.kicad.KiCad)
#   extra       = google-chrome  optional: third-party software with a built-in recipe (only 'google-chrome' for now)
#   enabled     = no           optional: hide a draft course
#
# Check the names before shipping (no root needed):  polios-welcome-helper --check
# Lines starting with # are comments. Edit /opt/polios-welcome/courses.conf on an
# installed system, or this file in the source folder and re-run install.sh.

# --- TEMPORARY: Replace once we have the list ---------------------------------

[computer]
title = Ingegneria Informatica
title_en = Computer Engineering 
description = Compilatori, debugger, git
description_en = Compilers, debugger, git
apt = build-essential gdb git

[electronics]
title = Elettronica 
title_en = Electronics 
description = Simulazione VHDL e progettazione PCB
description_en = VHDL simulation and PCB design
apt = ghdl gtkwave kicad

[aerospace]
title = Ingegneria Aerospaziale
title_en = Aerospace Engineering
description = Simulazione e CAD
description_en = Simulation and CAD
apt = octave freecad
flatpak = org.kicad.KiCad

[chrome]
title = Google Chrome
title_en = Google Chrome
description = Browser (scaricato da Google)
description_en = Browser (downloaded from Google)
extra = google-chrome
